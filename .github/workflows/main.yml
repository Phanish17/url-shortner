name: Build and Deploy URL Shortener

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # 1. Get source code
      - name: Checkout
        uses: actions/checkout@v4


      # 2. Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'


      # 3. Build Spring Boot application
      - name: Build with Maven
        run: ./mvnw clean package -DskipTests


      # 4. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # 5. Build Docker image
      - name: Build Docker image
        run: docker build -t phanishhh/urlshortner:latest .


      # 6. Push Docker image to Docker Hub
      - name: Push Docker image
        run: docker push phanishhh/urlshortner:latest


      # 7. Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |

            # Pull latest image
            sudo docker pull phanishhh/urlshortner:latest

            # Stop old application container
            sudo docker stop urlshortner-container || true

            # Remove old application container
            sudo docker rm urlshortner-container || true

            # Start new application container
            sudo docker run -d \
              --name urlshortner-container \
              --network url-network \
              -p 8080:8080 \
              phanishhh/urlshortner:latest
