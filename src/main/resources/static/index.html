<!DOCTYPE html>
<html>
<head>
    <title>URL Shortener</title>
    <style>
        body{
        font-family: Arial;
        text-align:center;
        margin-top:100px;
        }

        input{
        padding:10px;
        width:300px;
        margin:10px;
        }

        button{
        padding:10px 20px;
        cursor:pointer;
        }

        #result{
        margin-top:20px;
        font-weight:bold;
        }
    </style>
</head>

<body>

<h2>URL Shortener</h2>

<input id="url" placeholder="url enter"><br>

<input id="custom" placeholder="anything u want put "><br>

<button onclick="shorten()">Shorten</button>

<p id="result"></p>

<script>

    async function shorten(){

    let url = document.getElementById("url").value;
    let custom = document.getElementById("custom").value;

    let bodyData = {
    url: url
    };

    if(custom){
    bodyData.customCode = custom;
    }

    let response = await fetch("/shorten",{
    method:"POST",
    headers:{
    "Content-Type":"application/json"
    },
    body: JSON.stringify(bodyData)
    });

    let data = await response.json();

        let shortUrl = "http://18.60.81.166:8080/" + data.shortCode;

        document.getElementById("result").innerHTML =
            `Short URL: <a href="${shortUrl}" target="_blank">${shortUrl}</a>`;

    }

</script>

</body>
</html>
