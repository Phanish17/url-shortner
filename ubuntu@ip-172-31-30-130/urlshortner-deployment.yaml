apiVersion: apps/v1
kind: Deployment

metadata:
  name: urlshortner

spec:
  replicas: 2

  selector:
    matchLabels:
      app: urlshortner

  template:
    metadata:
      labels:
        app: urlshortner

    spec:
      containers:
        - name: urlshortner
          image: phanishhh/urlshortner:v2
          ports:
            - containerPort: 8080